version: '3.8'

services:
  firefox:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: firefox
    expose:
      - "5800"
    environment:
      # Configuración de seguridad
      - VNC_PASSWORD=${VNC_PASSWORD:-firefox123}
      - DISPLAY_WIDTH=1920
      - DISPLAY_HEIGHT=1080
      # Habilitar audio web si es necesario
      - WEB_AUDIO=1
      # Habilitar gestor de archivos web
      - WEB_FILE_MANAGER=1
      # Permitir todas las rutas comunes
      - WEB_FILE_MANAGER_ALLOWED_PATHS=AUTO
    volumes:
      - firefox-data:/config
    restart: unless-stopped
    networks:
      - firefox-network
      - notifuse_web
    # Permitir membarrier system call para evitar crashes
    security_opt:
      - seccomp=unconfined
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 5G
        reservations:
          memory: 2G

volumes:
  firefox-data:
    driver: local

networks:
  firefox-network:
    driver: bridge
  notifuse_web:
    external: true
